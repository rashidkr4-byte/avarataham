<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HQ Cloud - Admin Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrapper { max-width: 900px; margin: 50px auto; padding: 20px; }
        .admin-card { background: #0c1017; border: 1px solid var(--border-color); border-radius: 14px; padding: 36px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .admin-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .admin-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 16px; background: #05070a; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
        .admin-btn { padding: 12px 24px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25); }
        .admin-btn:hover { background: #059669; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: #05070a; border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; }
        .stat-value { font-size: 24px; font-weight: 800; color: var(--accent); margin-top: 5px; }
        .error-msg { color: #ef4444; font-size: 12px; margin-bottom: 15px; display: none; }
        #adminPanel { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html" class="logo-area" style="display: flex; align-items: center; text-decoration: none; color: var(--text-main); font-weight: 800; font-size: 18px; gap: 10px;">
                <img src="logo.png" alt="Logo" style="height: 32px; width: auto; display: block;" onerror="this.style.display='none'">
                <span>HQ CLOUD ADMIN</span>
            </a>
        </div>
        <div class="header-right">
            <a href="index.html" class="discord-btn" style="text-decoration: none;">Back to Site</a>
        </div>
    </header>

    <div class="admin-wrapper">
        <!-- Admin Login Form -->
        <div id="adminLoginBox" class="admin-card" style="max-width: 420px; margin: 0 auto;">
            <div class="admin-title">Admin Portal</div>
            <div class="admin-sub">Enter administrator credentials (entothic@gmail.com) to access control panel.</div>
            
            <div id="loginError" class="error-msg"></div>

            <div class="form-group">
                <label>Admin Username / Email</label>
                <input type="text" id="adminUser" placeholder="muhammed or entothic@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="••••••••">
            </div>

            <button onclick="handleAdminLogin()" class="admin-btn" style="width: 100%;">Login to Admin</button>
        </div>

        <!-- Admin Control Panel -->
        <div id="adminPanel" class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <div class="admin-title">Platform Dashboard</div>
                    <div class="admin-sub" style="margin-bottom: 0;">Logged in as: <b>entothic@gmail.com</b></div>
                </div>
                <button onclick="adminLogout()" class="admin-btn" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444;">Logout</button>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Registered Users</div>
                    <div id="statUsers" class="stat-value">0</div>
                </div>
                <div class="stat-box">
                    <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Active API Keys</div>
                    <div id="statKeys" class="stat-value">0</div>
                </div>
            </div>

            <div class="form-group">
                <label>Announcement Banner Text</label>
                <textarea id="announcementInput" rows="3" placeholder="Set global platform notice here..."></textarea>
            </div>
            <button onclick="saveAnnouncement()" class="admin-btn">Save Changes</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('hq_is_admin') === 'true') {
                showAdminPanel();
            }
        }

        function handleAdminLogin() {
            const user = document.getElementById('adminUser').value.trim().toLowerCase();
            const pass = document.getElementById('adminPass').value;
            const errEl = document.getElementById('loginError');

            // Hardcoded check for muhammed / main / entothic@gmail.com
            const isValidUser = (user === 'muhammed' || user === 'entothic@gmail.com');
            const isValidPass = (pass === 'main');

            if (isValidUser && isValidPass) {
                localStorage.setItem('hq_is_admin', 'true');
                showAdminPanel();
            } else {
                errEl.innerText = 'Invalid admin username, email, or password.';
                errEl.style.display = 'block';
            }
        }

        function showAdminPanel() {
            document.getElementById('adminLoginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';

            const regUser = localStorage.getItem('hq_registered_user');
            document.getElementById('statUsers').innerText = regUser ? '1' : '0';

            const keys = JSON.parse(localStorage.getItem('hq_api_keys') || '[]');
            document.getElementById('statKeys').innerText = keys.length;

            const savedNotice = localStorage.getItem('hq_announcement') || '';
            document.getElementById('announcementInput').value = savedNotice;
        }

        function saveAnnouncement() {
            const notice = document.getElementById('announcementInput').value;
            localStorage.setItem('hq_announcement', notice);
            alert('Announcement updated successfully!');
        }

        function adminLogout() {
            localStorage.removeItem('hq_is_admin');
            location.reload();
        }
    </script>
</body>
</html>
